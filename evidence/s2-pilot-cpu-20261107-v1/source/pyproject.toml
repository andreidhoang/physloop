[project]
name = "physloop-gate"
version = "0.0.0"
description = "Paired, stratified release gate for closed-loop driving policies."
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "pyarrow",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "shapely==2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["star: known answers for the ★ cores; red until Huy writes them"]

[tool.ruff]
line-length = 100
