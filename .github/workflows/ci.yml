name: ci

on:
  push:
  pull_request:

jobs:
  plumbing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check gate tests
      - run: uv run pytest -m "not star"

  # Core/reference/proof checks; required branch protection is configured separately in GitHub.
  known-answers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m star
