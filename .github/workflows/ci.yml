name: ci

on:
  push:
  pull_request:

jobs:
  plumbing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check gate teacher_rl scripts tests
      - run: uv run pytest -m "not star"

  # D-024 S4 harness: CPU PyTorch from the non-default s4 group; skipping is a failure here.
  s4-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group s4
      - run: PHYSLOOP_REQUIRE_TORCH=1 uv run pytest tests/s4_torch

  # Core/reference/proof checks; required branch protection is configured separately in GitHub.
  known-answers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m star
