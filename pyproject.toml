[project]
name = "physloop-gate"
version = "0.0.0"
description = "Paired, stratified release gate for closed-loop driving policies."
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "protobuf==7.36.2",
    "pyarrow==25.0.1",
    # D-024: the S2 guest runner parses AlpaSim's generated YAML configs (camera/compose checks).
    "pyyaml==6.0.3",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "shapely==2.1.2",
]
# D-024: CPU-only S4 harness tests. Not a default group; torch matches the
# Alpamayo recipes / AlpaGym pin (2.8.0) and safetensors the AlpaGym lock (0.7.0).
s4 = [
    "safetensors==0.7.0",
    "torch==2.8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate", "teacher_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["star: known answers for the ★ cores; red until Huy writes them"]

[tool.ruff]
line-length = 100
